name: Palomar preflight for Chen–Shan auxiliary completion

on:
  push:
    branches: [palomar-chen-shan-auxiliary]
  workflow_dispatch:

jobs:
  preflight:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@14aa8d6b3c2f14a8540605e37144560b9a00e7e7
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
      pipeline_commit: 14aa8d6b3c2f14a8540605e37144560b9a00e7e7
      request_id: chenshanaux1
      mode: full
      execution_profile: palomar-standard-v1
      options: '{"comparator_config_path":"comparator.chen-shan-auxiliary.json","formalization_metadata_path":"palomar/chen-shan-auxiliary/formalization.yaml","authorization_relationship":"I am a responsible author or maintainer"}'
