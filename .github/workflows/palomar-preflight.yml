name: Palomar mechanical preflight

on:
  push:
    branches: [palomar-cms-ii]
  workflow_dispatch:

jobs:
  preflight:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@14aa8d6b3c2f14a8540605e37144560b9a00e7e7
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
      pipeline_commit: 14aa8d6b3c2f14a8540605e37144560b9a00e7e7
      request_id: cmsiiproof01
      mode: full
      execution_profile: palomar-standard-v1
      options: '{"comparator_config_path":"comparator.cms-ii.json","authorization_relationship":"I am a responsible author or maintainer"}'
