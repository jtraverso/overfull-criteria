fidelity:
  divergences: Lemma 3.23 is stated for positive delta and tau and applies in the ranges of the article.
    The completion is on a disjoint sum. Pairwise multiplicity identities express both induced graphs
    and the simplicity of every added edge. The theorems keep the paper’s deficit, parity, minimum-degree,
    and overfull-set conditions. Lemma 4.6 orients each tripartite edge once and gives an explicit bound
    on the common side size. Lemma 4.7 uses the paper's cut inequalities and proves flow feasibility by
    minimizing squared residual demand and saturating the cut from vertices with positive residual. Lemma
    4.8 records the explicit threshold and uses a convergent geometric series of corrections. Lemma 4.10
    uses a two-sided finite Chernoff bound with 1/4 in the exponent and an unrounded real hypergraph degree
    bound. It imports Theorem 1.2 of Ehard, Glock, and Joos at a pinned commit. Lemma 5.22 uses induced
    complements and retains the paper's bound of 135720 discarded prescribed edges.
