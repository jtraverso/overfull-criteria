status:
  scope: >-
    Two restated criteria and the elementary conversion from overfull graphs to overfull
    subgraphs. Nothing beyond the two dependencies is claimed.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["Claude Opus 5.5"]
      framework: "Claude Code (Anthropic)"
      tool_setup: >-
        Wrote the wrapper (OverfullCriteria/Basic.lean), the Challenge/Solution pair and the
        packaging under the author's direction. Checked with a local build against the pinned
        dependencies, a comparison of the elaborated Challenge and Solution statements (pp.all),
        and #print axioms (Lean v4.35.0-rc3, Mathlib c55e6e786f49471c72fbddbec5415808896aec1e).
      cost:
        wall_time: "under an hour"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: "Natural-language instructions in Spanish, directed by the author."
  spend_usd: "subscription-based"
  notes: >-
    The Lean development is AI-written under the author's direction and mechanically verified: no
    sorry, axioms limited to propext, Classical.choice and Quot.sound, identical elaborated
    statements in the Challenge and the Solution.

fidelity:
  divergences: >-
    Edge colourings are colourings of the line graph; Δ-critical is spelled out as three
    hypotheses (connected, class two, every edge-deleted subgraph Δ-colourable); a Δ-overfull
    subgraph is a G.Subgraph H with Odd |V(H)|, 3 ≤ |V(H)| and Δ (|V(H)| − 1) < 2 |E(H)| (Set.ncard).

review:
  status: "agent-reviewed"
  reviewers:
    - "Claude Opus 5.5 (AI agent in Claude Code, acting for the author)"
  notes: >-
    Agent review by Claude Opus 5.5, distinct from the mechanical verification: the agent checked
    that the restated statements match those of the two dependencies (the proofs are direct
    applications). The degree conditions of critical_overfull force δ to be small compared with
    Δ (for instance 2n + 5δ ≤ 3Δ + 6 and Δ ≤ n − 1 give 5δ ≤ n + 3), as in the sources. No
    independent human review has been performed.

alignment:
  namespace: "OverfullCriteria"
  statements:
    - {source: "Plantholt 2004, Theorem 1.2 with c = 6/7", lean: "OverfullCriteria.class_two_iff_overfull_subgraph", module: "OverfullCriteriaChallenge", status: "proved"}
    - {source: "Chen–Cao Theorem 1.3; Cao–Chen–Jing–Shan Theorem 1.2", lean: "OverfullCriteria.critical_overfull", module: "OverfullCriteriaChallenge", status: "proved"}

