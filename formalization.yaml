version: v0.4
project:
  name: Auxiliary completion, triangle absorption, and matching retention
  description: Lean formalizations of eight structural results of Chen and Shan on graph completion and
    decomposition. They cover robust realization of degree sequences, regular auxiliary completion, tripartite
    absorption and fractional and approximate triangle decomposition, bounded signed edge weights in dense
    bipartite graphs, and retention of prescribed edges in a perfect matching.
  authors:
  - Juan Pablo Traverso Gianini
  responsible_maintainers:
  - Juan Pablo Traverso Gianini
  license: Apache-2.0
