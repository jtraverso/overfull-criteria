# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Shan's Towards the Overfull Conjecture in Lean"
  description: >-
    Theorems 1.3 and 1.4 of Songling Shan's Towards the Overfull Conjecture,
    proved as consequences of Chen–McDonald–Shan. They give the overfull
    criterion for large simple graphs at the stated degree threshold and the
    average-degree bound for large edge-chromatic critical graphs.
  authors:
    - "Juan Pablo Traverso Gianini"
  responsible_maintainers:
    - "Juan Pablo Traverso Gianini"
  license: "Apache-2.0"

classification:
  arxiv: ["math.CO"]
  msc2020: ["05C15", "68V20"]

sources:
  - title: "Towards the Overfull Conjecture"
    authors: ["Songling Shan"]
    id: "arXiv:2308.16808"
    location: "arXiv v4, Theorems 1.3 and 1.4."
    relationship: formalizes
  - title: "Towards the Overfull Conjecture II"
    authors: ["Guantao Chen", "Jessica McDonald", "Songling Shan"]
    id: "arXiv:2607.02270"
    location: "Theorem 1.4 supplies the stronger fixed-margin criterion."
    relationship: formalizes

status:
  scope: "The two main theorem statements of Shan v4."
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["OpenAI GPT-6"]
      framework: "OpenAI Codex"
      tool_setup: "Lean 4, Mathlib, Lake builds, and axiom audits under author direction."
  spend_usd: "not tracked"
  notes: "The Lean development and packaging were AI-assisted under human direction."

fidelity:
  divergences: >-
    Theorems 1.3 and 1.4 follow from the stronger fixed-margin theorem of
    Chen–McDonald–Shan. The formal edge-criticality predicate uses
    connectedness, a class-two obstruction, and colorability after any
    single-edge deletion.

review:
  status: "self-assessed"
  reviewers: []
  notes: "ShanIChallenge states the two theorems independently of ShanISolution."

alignment:
  namespace: "OverfullWork.ShanI"
  statements:
    - source: "Shan v4, Theorem 1.3"
      lean: "OverfullWork.ShanI.shan_v4_theorem_1_3"
      module: "OverfullWork.ShanI"
      status: "formalized"
    - source: "Shan v4, Theorem 1.4"
      lean: "OverfullWork.ShanI.shan_v4_theorem_1_4"
      module: "OverfullWork.ShanI"
      status: "formalized"

acknowledgements: "Lean and Mathlib, and the authors of the mathematical sources."
