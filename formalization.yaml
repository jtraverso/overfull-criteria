# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Overfull criteria for edge colouring (Plantholt; Chen–Cao; Cao–Chen–Jing–Shan), unified"
  description: >-
    A thin wrapper that restates, in one vocabulary and with Mathlib definitions only, the overfull
    criteria proved in PALOMAR-2026-11-04-000016 and PALOMAR-2026-11-04-000009.
    class_two_iff_overfull_subgraph: a finite simple graph of even order n with
    12 n ≤ 7 (3δ − Δ) is of class two (its line graph is not Δ-colourable) iff it has a
    Δ-overfull subgraph (odd order at least 3, more than Δ (|V(H)| − 1)/2 edges); this is
    Plantholt's criterion with Chetwynd–Hilton's 6/7. critical_overfull: a Δ-critical graph
    (connected, class two, every edge-deleted subgraph Δ-colourable) with 2n + 5δ ≤ 3Δ + 6
    (Chen–Cao), or 3n + 7δ ≤ 4Δ + 10 (Cao–Chen–Jing–Shan, variant), or 3n + 7δ ≤ 4Δ + 17 and
    n + δ ≥ 27 (Cao–Chen–Jing–Shan) has odd order, is overfull (|E| > Δ ⌊n/2⌋), and so is a
    Δ-overfull subgraph of itself. The only new proof is the elementary step from overfullness to
    odd order at least 3 (degree sum) and the conversion to the subgraph form. Two statements; no
    definitions beyond Mathlib's.
  authors:
    - "Juan Pablo Traverso Gianini"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Juan Pablo Traverso Gianini"

