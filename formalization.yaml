# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Towards the Overfull Conjecture II in Lean"
  description: >-
    A Lean formalization of the two main theorems of Chen, McDonald, and Shan.
    Theorem 1.3 proves the overfull criterion for sufficiently large robust
    expanders with linear maximum degree, weak Vizing adjacency, and few
    vertices of large degree deficit. Theorem 1.4 gives the criterion for
    sufficiently large simple graphs whose maximum degree is at least
    (1 + epsilon) times half the order, for every fixed positive epsilon.
    The proof includes the reduction to critical graphs, the two stopping
    routes, and the coloring of the canonical completion.
  authors:
    - "Juan Pablo Traverso Gianini"
  responsible_maintainers:
    - "Juan Pablo Traverso Gianini"
  license: "Apache-2.0"

classification:
  arxiv: ["math.CO"]
  msc2020: ["05C15", "05C35", "05C45", "68V20"]

sources:
  - title: "Towards the Overfull Conjecture II"
    authors: ["Guantao Chen", "Jessica McDonald", "Songling Shan"]
    id: "arXiv:2607.02270"
    location: "Theorems 1.3 and 1.4 of v1, with the reduction and proof in Sections 2–5."
    relationship: formalizes
  - title: "On the average degree of edge chromatic critical graphs II"
    authors: ["Yan Cao", "Guantao Chen"]
    id: "doi:10.1016/j.jctb.2020.07.007"
    location: "The asymptotic average-degree estimate used as Lemma 2.4 of Chen–McDonald–Shan."
    relationship: formalizes
  - title: "Hamilton decompositions of regular expanders: applications"
    authors: ["Daniela Kühn", "Deryk Osthus"]
    id: "arXiv:1203.0659"
    location: "Theorem 1.2, existence of undirected Hamilton decompositions at even degree."
    relationship: formalizes

status:
  scope: >-
    The two main theorems are compared independently. The proofs include the
    canonical completion criterion (Theorem 4.2) and the existence forms of
    supporting expansion and decomposition results. The scope is the main
    results of this article and their proof dependencies.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["OpenAI GPT-6"]
      framework: "OpenAI Codex"
      tool_setup: "Lean 4, Mathlib, Lake builds, and axiom audits under author direction."
  spend_usd: "not tracked"
  notes: "The Lean development and packaging were AI-assisted under human direction."

fidelity:
  divergences: >-
    Theorem 1.3 states an explicit existential hierarchy with 0 < tau < 1/2
    and 0 < etaMax < 1, and a weak inequality in the exceptional-set bound.
    Theorem 1.4 uses the degree threshold from
    the article. The proofs use existence forms of auxiliary factorization
    and decomposition results, and sufficient quantitative versions of
    regularity, concentration, and degree estimates.

review:
  status: "self-assessed"
  reviewers: []
  notes: "Challenge states the two main theorems independently of Solution."

alignment:
  namespace: "OverfullWork"
  statements:
    - source: "Chen–McDonald–Shan, Theorem 1.3"
      lean: "OverfullWork.CMSTrimmingRound.cms_theorem_1_3"
      module: "OverfullWork.CMSTheorem13"
      status: "formalized"
    - source: "Chen–McDonald–Shan, Theorem 1.4"
      lean: "OverfullWork.Gate8J.cms_theorem_1_4"
      module: "OverfullWork.CMSTheorem14"
      status: "formalized"

acknowledgements: "Lean and Mathlib, and the authors of the mathematical sources."
